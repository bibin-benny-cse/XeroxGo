name: XeroxGo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Go workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: |
            go.work.sum
            cloud-backend/go.sum
            kiosk-daemon/go.sum

      - name: Install PDF conversion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf ghostscript libreoffice poppler-utils

      - name: Run verification gates
        run: bash ./scripts/verify_gate.sh
